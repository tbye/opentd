{% extends "base.html" %}
{% load i18n %}

{% block page_title %}Password changed — {{ site_name }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-12">
  <div class="card bg-base-100 border border-base-300 shadow-sm">
    <div class="card-body">
      <h1 class="card-title text-2xl">{% trans "Change Password" %}</h1>
      <p class="opacity-80">{% trans "Your password is now changed." %}</p>
      <div class="card-actions justify-end mt-4">
        <a href="{% url 'account_login' %}" class="btn btn-primary btn-sm">{% trans "Sign in" %}</a>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
