version: '3.8'

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      # Persisted on the host at /data/django-apps/opentd/db.sqlite3
      SQLITE_PATH: /data/django-apps/opentd/db.sqlite3
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://opentd.org}
      SITE_NAME: ${SITE_NAME:-OpenTD.org}
      SITE_DOMAIN: ${SITE_DOMAIN:-opentd.org}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # Must be a real address on your Resend-verified domain in production.
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-OpenTD <support@opentd.org>}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-opentd.org,localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://opentd.org}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      PENDING_GAME_RETENTION_DAYS: ${PENDING_GAME_RETENTION_DAYS:-14}
    volumes:
      # Whole data dir so SQLite (and -wal/-shm) survives redeploys
      - /data/django-apps/opentd:/data/django-apps/opentd
      - /data/django-apps/opentd/staticfiles:/app/staticfiles
      - /data/django-apps/opentd/mediafiles:/app/mediafiles
    networks:
      - opentd
      - coolify

  static:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '8180:80'
    volumes:
      - '/data/django-apps/opentd/staticfiles:/static'
      - '/data/django-apps/opentd/mediafiles:/media'
    command:
      caddy file-server --root / --listen :80 --browse=false
    networks:
      - opentd

networks:
  opentd:
    driver: bridge
  coolify:
    external: true
